<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consultores de Historia Familiar</title>
<style>
:root{--g:#8cb83e;--gd:#6a9a22;--gk:#3f6212;--gl:#eef5dd;--bg:#f6f8f0;--c:#fff;--t:#2f3a26;--m:#6b7560;--l:#dde5cc;--gold:#f2b134;--gold2:#d6951a;--blue:#2a7ab0}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--c);border-bottom:3px solid var(--g);padding:10px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--gk);font-size:17px}
.logo span{font-size:28px}
.hbtn{display:flex;gap:8px;align-items:center}
.xp{background:var(--gold);color:#fff;font-weight:800;padding:6px 12px;border-radius:20px;font-size:14px;box-shadow:0 3px 0 var(--gold2)}
.tbtn{border:2px solid var(--l);background:#fff;border-radius:10px;padding:6px 10px;cursor:pointer;font-size:13px;color:var(--m)}
main{max-width:680px;margin:0 auto;padding:18px}
.hero{background:linear-gradient(135deg,var(--gd),var(--g) 60%,#b5d56a);color:#fff;border-radius:22px;padding:26px 22px;position:relative;overflow:hidden;margin-bottom:22px;box-shadow:0 6px 0 var(--gk)}
.hero:after{content:"🌳";position:absolute;right:-10px;bottom:-24px;font-size:130px;opacity:.22}
.hero h2{margin:0 0 4px;font-size:24px}
.hero p{margin:0 0 16px;opacity:.95}
.bar{height:16px;background:rgba(255,255,255,.35);border-radius:10px;overflow:hidden;max-width:420px}
.bar i{display:block;height:100%;background:#fff;border-radius:10px;transition:width .5s}
.stats{display:flex;gap:16px;margin-top:10px;font-weight:700;font-size:14px;flex-wrap:wrap}
.chap{background:var(--c);border:2px solid var(--l);border-radius:20px;margin-bottom:22px;overflow:hidden}
.chap.lock{opacity:.6}
.ch{display:flex;align-items:center;gap:14px;padding:14px 18px;background:var(--gl);border-bottom:2px solid var(--l)}
.num{width:46px;height:46px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:800;box-shadow:0 4px 0 var(--gd);flex:none}
.chap.fin .num{background:var(--gold);box-shadow:0 4px 0 var(--gold2)}
.ch b{display:block;font-size:17px;color:var(--gk)}
.ch small{color:var(--m)}
.path{display:flex;flex-direction:column;align-items:center;padding:20px 0 10px;background:repeating-linear-gradient(to bottom,var(--l) 0 8px,transparent 8px 16px) center/3px 100% no-repeat}
.step{display:flex;flex-direction:column;align-items:center;margin-bottom:16px;width:130px}
.node{width:70px;height:70px;border-radius:50%;border:0;background:var(--g);box-shadow:0 7px 0 var(--gd);font-size:28px;cursor:pointer;color:#fff;transition:.1s}
.node:active{transform:translateY(4px);box-shadow:0 3px 0 var(--gd)}
.node.done{background:var(--gold);box-shadow:0 7px 0 var(--gold2)}
.node.cur{animation:pulse 1.6s infinite}
.node.lk{background:#d9dfcc;box-shadow:0 7px 0 #bfc7ae;cursor:not-allowed;filter:grayscale(.6)}
@keyframes pulse{50%{transform:scale(1.1)}}
.lbl{font-size:12px;font-weight:600;color:var(--m);margin-top:10px;text-align:center;background:var(--bg);padding:0 4px}
.reward{display:flex;align-items:center;gap:12px;margin:6px 18px 18px;padding:12px 16px;border-radius:14px;background:var(--gl);border:2px dashed var(--g)}
.reward.on{background:#fff6dc;border-color:var(--gold)}
.reward .ic{font-size:36px;filter:grayscale(1) opacity(.4)}
.reward.on .ic{filter:none}
.reward small{display:block;color:var(--m)}
.final{text-align:center;padding:22px;border-radius:20px;background:#fff;border:2px solid var(--l)}
.final .ic{font-size:60px;filter:grayscale(1) opacity(.35)}
.final.on .ic{filter:none}
.back{background:none;border:0;color:var(--gd);font-weight:800;cursor:pointer;font-size:15px;margin-bottom:12px}
.lesson{background:var(--c);border:2px solid var(--l);border-radius:20px;padding:20px}
.lesson h2{margin:0 0 4px;color:var(--gk)}
.tag{color:var(--m);font-size:14px;margin-bottom:12px}
.frame{position:relative;padding-top:56.25%;border-radius:14px;overflow:hidden;background:#000;margin:12px 0}
.frame.doc{padding-top:125%}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.btn{display:inline-block;border:0;background:var(--g);color:#fff;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:13px 22px;border-radius:14px;box-shadow:0 5px 0 var(--gd);cursor:pointer;text-decoration:none;font-size:14px;margin:4px 6px 8px 0}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gd)}
.btn.b{background:var(--blue);box-shadow:0 5px 0 #1d5a85}
.done-msg{color:var(--gd);font-weight:700}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--gk);color:#fff;padding:14px 22px;border-radius:16px;font-weight:700;display:none;z-index:9;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.tbtn.rs{border-color:#e08a8a;color:#b83b3b;font-weight:700}
.shelf{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.sb{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.3);display:grid;place-items:center;font-size:22px;filter:grayscale(1) opacity(.55)}
.sb.on{background:#fff;filter:none;box-shadow:0 3px 0 var(--gold2)}
.ov{position:fixed;inset:0;background:rgba(30,45,15,.7);display:grid;place-items:center;z-index:20;padding:20px}
.mod{background:#fff;border-radius:26px;padding:30px 24px;text-align:center;max-width:360px;width:100%;box-shadow:0 8px 0 var(--gk);animation:pop .4s}
.mod .big{font-size:96px;line-height:1;display:inline-block;animation:spin .8s}
.mod h2{margin:10px 0 4px;color:var(--gk)}
.mod p{margin:0 0 16px;color:var(--m)}
.cf{position:fixed;top:-40px;font-size:26px;animation:fall 2.6s linear forwards;z-index:21;pointer-events:none}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes spin{from{transform:rotate(-200deg) scale(.2)}}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
footer{text-align:center;color:var(--m);font-size:12px;padding:10px 0 30px}
footer a{color:var(--m);cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<header>
  <div class="logo"><span>🌳</span><div>Consultores de<br>Historia Familiar</div></div>
  <div class="hbtn" style="flex-wrap:wrap;justify-content:flex-end"><button class="tbtn rs" onclick="reset()">🔄 Reiniciar certificación</button><button class="tbtn" id="tb" onclick="toggleTest()">🔓 Modo prueba</button><div class="xp" id="xp"></div></div>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
/* ===== CONTENIDO =====
 d=PDF de Drive (id) · v=video YouTube (id) · s=presentación (id) · q=cuestionario (url) · a=apps (android, ios) */
const SL = "https://docs.google.com/presentation/d/e/";
const C = [
 {id:"intro", t:"Introducción", s:"Mi llamamiento como consultor", b:["Llamado","🎖️"], it:[
  ["d","1wR9iiJakbHtSrN457dXiatlBOu7Fyv61"],["v","0z-S2GcvtMA"],["v","svaU-3OQ4i4"],["v","aqmkkYuXXMk"],["v","hwRLNbkPHy0"],
  ["q","https://forms.gle/rFPUfvs3RBDb5jAQ9"]]},
 {id:"c1", t:"Capítulo 1", s:"Introducción a FamilySearch", b:["Explorador","🧭"], it:[
  ["v","mxOiiC9XTIM"],["v","hiFtNRFkOx0"],
  ["s","2PACX-1vRJ4aW-6iCMCfJML-zLBQ_EdtbNZaf6XlsCvWXA3QS7mqpmrL1KFsiJt-64Q8sLQQJY6xVnEfHoQRGR"],
  ["d","1pYzVk3jEHj3n263U9-pSbM5aGPYhbfR9"],
  ["q","https://forms.gle/CigjGSsz7t4hahnXA"]]},
 {id:"c2", t:"Capítulo 2", s:"Cuentas FamilySearch", b:["Conectado","🔑"], it:[
  ["v","XB6VaNIfLP0"],
  ["s","2PACX-1vRIGOheHH9TUCWiPRHoF7K4_EknES20BLu4DGtPsCJHzJG5V6Z5xcodE8lXOhhqQG1ttt6Beu8EjnN_"],
  ["q","https://forms.gle/5XuAzgH3JuzDwFnL8"]]},
 {id:"c3", t:"Capítulo 3", s:"Árbol Familiar, Parte 1", b:["Raíces","🌱"], it:[
  ["v","n9UCcf1nDb8"],["v","G6J24CnOXjs"],
  ["s","2PACX-1vQM4b4OcIOVDqKx9u_8FycoiOTqY_XN3nlnIyisdyD-EQbH3SfvEItgi_h8dMGdDGlJCp-Y6NT4VnhF"],
  ["q","https://docs.google.com/forms/d/e/1FAIpQLSdAgO4VGDC_07p0n78B_lWaQYe4aLXfCSIqPubVjw0cE1zOGQ/viewform"]]},
 {id:"c4", t:"Capítulo 4", s:"Árbol Familiar, Parte 2", b:["Ramas","🌿"], it:[
  ["v","528idVNcX90"],
  ["s","2PACX-1vQd57Y3qlLZV8xXsJGqxyCfCsWmZ5WVe-X0CiZ8dPF42GN7HrY4neVzNydmyP7_kr3CFb_dYLOopag1"],
  ["q","https://forms.gle/Gj1viF2TTMzs59mU8"]]},
 {id:"c5", t:"Capítulo 5", s:"Ordenanzas", b:["Templo","🏛️"], it:[
  ["v","f-uzXDzB1Qc"],["v","VNbVL7G8trI"],["v","zUfBxzqXh7Y"],
  ["s","2PACX-1vQxcCvRWv-xXn0TGMA5JiVeR4e51_HlRXqNQLvcm1MoaHCzQXyOM8knoD_BAn2qmKXK2AgjSq1cdfry"],
  ["q","https://forms.gle/foX8XwHQM5atJjfL8"]]},
 {id:"c6", t:"Capítulo 6", s:"Permisos para casos de 110 años", b:["Guardián","🛡️"], it:[
  ["v","c1F2tNLmeDw"],
  ["s","2PACX-1vTdKWrkO-mblqI3lMl3WZtFcOY0-D-059r8-LuIE8ESU1MDLVXWDQArTLJYax4PZ0-TPGHdTmPsxJJq"],
  ["q","https://docs.google.com/forms/d/e/1FAIpQLSfzvF_ldETOzMeuVvPYwZB-WPaS8ISP3uUv5kWmavkL7iX7uQ/viewform"]]},
 {id:"c7", t:"Capítulo 7", s:"Indexación y Revisión", b:["Indexador","🔍"], it:[
  ["v","-jVcQDHQMlQ"],["v","c6pUg2pjSyk"],
  ["a","https://play.google.com/store/apps/details?id=org.familysearch.mobile.idx.review&hl=es_419","https://apps.apple.com/mx/app/familysearch-participa/id1567446332"],
  ["q","https://docs.google.com/forms/d/e/1FAIpQLSdv7tbqbNfSb_KBytozu5gn37mxjBVKu-oS13TdozSGkYujZg/viewform"]]}
];
const XP_STEP=10, XP_CH=30, SK="fs_prog_v1";
const ICON={v:"▶️",s:"📊",d:"📘",q:"✏️",a:"📱"};

/* ===== ESTADO ===== */
let prog={}, test=false;
try{prog=JSON.parse(localStorage.getItem(SK))||{}}catch(e){}
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(SK,JSON.stringify(prog))}catch(e){}};
const done=(c,i)=>!!prog[C[c].id+":"+i];
const chDone=c=>C[c].it.every((_,i)=>done(c,i));
const chOpen=c=>test||c===0||chDone(c-1);
const stepOpen=(c,i)=>test||(chOpen(c)&&(i===0||done(c,i-1)));
const xp=()=>Object.keys(prog).length*XP_STEP+C.filter((_,c)=>chDone(c)).length*XP_CH;
function labels(c){const n={v:0};return C[c].it.map(x=>{if(x[0]==="v"){n.v++;return"Video "+n.v}return{d:"Lectura (PDF)",s:"Presentación",q:"Cuestionario",a:"App móvil"}[x[0]]})}
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",2800)}
function toggleTest(){test=!test;$("tb").textContent=test?"🔒 Salir de prueba":"🔓 Modo prueba";home()}
function reset(){if(confirm("¿Borrar todo tu progreso?")){prog={};save();home()}}

/* ===== VISTAS ===== */
function home(){
  $("xp").textContent="⚡ "+xp()+" XP";
  const tot=C.reduce((a,c)=>a+c.it.length,0), n=Object.keys(prog).length, fin=C.filter((_,c)=>chDone(c)).length;
  let h=`<div class="hero"><h2>Tu camino a Consultor</h2><p>Completa cada capítulo, gana insignias y avanza paso a paso.</p>
  <div class="bar"><i style="width:${n/tot*100}%"></i></div>
  <div class="stats"><span>✅ ${n}/${tot} pasos</span><span>🏅 ${fin}/${C.length} insignias</span></div>
  <div class="shelf">${C.map((c,ci)=>`<div class="sb ${chDone(ci)?"on":""}" title="${c.b[0]}">${c.b[1]}</div>`).join("")}</div></div>`;
  C.forEach((c,ci)=>{
    const open=chOpen(ci), L=labels(ci), ok=chDone(ci);
    let cur=c.it.findIndex((_,i)=>!done(ci,i));
    h+=`<div class="chap ${open?"":"lock"} ${ok?"fin":""}"><div class="ch"><div class="num">${ok?"✓":ci===0?"★":ci}</div><div><b>${c.t}</b><small>${c.s}</small></div></div><div class="path">`;
    c.it.forEach((x,i)=>{
      const d=done(ci,i), o=stepOpen(ci,i), off=[0,38,0,-38][i%4];
      h+=`<div class="step" style="transform:translateX(${off}px)"><button class="node ${d?"done":o?(i===cur?"cur":""):"lk"}" ${o?"":"disabled"} onclick="lesson(${ci},${i})">${d?"✓":o?ICON[x[0]]:"🔒"}</button><div class="lbl">${L[i]}</div></div>`;
    });
    h+=`</div><div class="reward ${ok?"on":""}"><span class="ic">${c.b[1]}</span><div><b>Insignia: ${c.b[0]}</b><small>${ok?"¡Desbloqueada!":"Completa los "+c.it.length+" pasos"}</small></div></div></div>`;
  });
  const all=C.every((_,c)=>chDone(c));
  h+=`<div class="final ${all?"on":""}"><div class="ic">🏆</div><h3 style="margin:6px 0">Consultor de Historia Familiar</h3><div class="tag">${all?"¡Felicidades! Completaste toda la certificación.":"Completa los 8 capítulos para obtener tu certificación."}</div></div>`;
  h+=`<footer><a onclick="reset()">Reiniciar progreso</a></footer>`;
  $("app").innerHTML=h; scrollTo(0,0);
}

function lesson(ci,i){
  const c=C[ci], x=c.it[i], L=labels(ci)[i], k=x[0];
  let h=`<button class="back" onclick="home()">← Volver al camino</button><div class="lesson"><h2>${L}</h2><div class="tag">${c.t}: ${c.s}</div>`;
  if(k==="v") h+=`<div class="frame"><iframe src="https://www.youtube-nocookie.com/embed/${x[1]}" allowfullscreen loading="lazy"></iframe></div>`;
  if(k==="s") h+=`<div class="frame"><iframe src="${SL}${x[1]}/embed?start=false&loop=false&delayms=60000" allowfullscreen loading="lazy"></iframe></div><a class="btn b" target="_blank" rel="noopener" href="${SL}${x[1]}/pub?start=true&loop=false&delayms=60000">Abrir en pantalla completa</a>`;
  if(k==="d") h+=`<div class="frame doc"><iframe src="https://drive.google.com/file/d/${x[1]}/preview" loading="lazy"></iframe></div><a class="btn b" target="_blank" rel="noopener" href="https://drive.google.com/file/d/${x[1]}/view">Abrir en Drive</a>`;
  if(k==="q") h+=`<p>Abre el cuestionario, contéstalo y regresa aquí para marcarlo como completado.</p><a class="btn b" target="_blank" rel="noopener" href="${x[1]}">Abrir cuestionario</a>`;
  if(k==="a") h+=`<p>Descarga la app de FamilySearch para indexar y revisar desde tu teléfono.</p><a class="btn b" target="_blank" rel="noopener" href="${x[1]}">Android (Google Play)</a><a class="btn b" target="_blank" rel="noopener" href="${x[2]}">iPhone (App Store)</a>`;
  h+=`<div style="margin-top:14px">${done(ci,i)?`<span class="done-msg">✓ Paso completado</span>`:`<button class="btn" onclick="complete(${ci},${i})">${k==="q"?"Ya lo contesté":k==="a"?"Ya la tengo":"Completado"}</button>`}</div></div>`;
  $("app").innerHTML=h; scrollTo(0,0);
}

function complete(ci,i){
  prog[C[ci].id+":"+i]=true; save();
  home();
  if(chDone(ci)) celebrate(ci);
  else toast(`✅ ¡Muy bien! +${XP_STEP} XP`);
}
function celebrate(ci){
  const c=C[ci], all=C.every((_,k)=>chDone(k));
  const o=document.createElement("div"); o.className="ov";
  o.innerHTML=`<div class="mod"><div class="big">${all?"🏆":c.b[1]}</div><h2>${all?"¡Certificación completa!":"¡Insignia desbloqueada!"}</h2><p><b>${c.b[0]}</b> · ${c.t}: ${c.s}<br>+${XP_STEP+XP_CH} XP${all?"<br>Ya eres Consultor de Historia Familiar 🌳":""}</p><button class="btn" onclick="this.closest('.ov').remove()">Continuar</button></div>`;
  document.body.appendChild(o);
  for(let i=0;i<24;i++){const f=document.createElement("div");f.className="cf";f.textContent=["🌳","⭐","🎉","🌿","✨"][i%5];f.style.left=Math.random()*100+"vw";f.style.animationDelay=Math.random()*.8+"s";document.body.appendChild(f);setTimeout(()=>f.remove(),3600)}
}
home();
</script>
</body>
</html>
